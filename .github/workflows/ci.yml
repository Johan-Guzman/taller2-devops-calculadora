name: CI Taller 2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x test.sh && ./test.sh
      - run: docker build -f backend/Dockerfile -t calculadora-backend:ci .
      - run: docker build -f frontend/Dockerfile -t calculadora-frontend:ci .
