name: CI Taller 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: docker compose build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar scripts
        run: chmod +x scripts/test.sh scripts/test_endpoints.sh
      - name: Probar HU1-HU5
        run: ./scripts/test.sh
      - name: Levantar contenedores
        run: docker compose up -d --build
      - name: Probar endpoints
        run: ./scripts/test_endpoints.sh
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v --remove-orphans
