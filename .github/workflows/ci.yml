name: CI Taller 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x scripts/test.sh scripts/test_endpoints.sh
      - run: ./scripts/test.sh
      - run: docker compose up -d --build
      - run: ./scripts/test_endpoints.sh
      - if: always()
        run: docker compose down -v
