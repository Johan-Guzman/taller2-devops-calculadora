services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: calculadora-backend
    ports:
      - "8082:8080"
    volumes:
      - history-data:/app/data
    networks:
      - calculadora-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: calculadora-frontend
    ports:
      - "8081:8081"
    depends_on:
      - backend
    networks:
      - calculadora-network

volumes:
  history-data:

networks:
  calculadora-network:
    driver: bridge