services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      - history-data:/app/data
    networks:
      - calculadora-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PUBLIC_BACKEND_PORT: "${BACKEND_PORT:-8082}"
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    depends_on:
      - backend
    networks:
      - calculadora-network

volumes:
  history-data:

networks:
  calculadora-network:
    driver: bridge
